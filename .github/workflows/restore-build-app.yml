name: Restore build-app workflow

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and write build-app.yml
        run: |
          set -euo pipefail
          base64 -d scripts/build-app.yml.b64 > .github/workflows/build-app.yml
          wc -c .github/workflows/build-app.yml
          grep -q "Patcher avec Morphe CLI" .github/workflows/build-app.yml
          grep -q "use_native_ui" .github/workflows/build-app.yml
          git config user.name "ModProd Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-app.yml
          git commit -m "fix(v1): restore full build-app.yml with optional native-ui experimental base"
          git pull --rebase origin main || true
          git push origin HEAD:main
