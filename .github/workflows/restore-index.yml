name: Restore index.html

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add webTheme form selector
        run: |
          set -euo pipefail
          python3 scripts/patch_webtheme.py
          git config user.name "ModProd Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "feat(v1): add webTheme selector to web/html form"
          git pull --rebase origin main
          git push origin HEAD:main
