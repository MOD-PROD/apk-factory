name: Restore index.html
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full index.html from last good commit
        run: |
          set -euo pipefail
          git checkout 483e7e6bcec1578d7a0934084ea7651779ca6638 -- index.html
          wc -c index.html
          grep -c "Fabriquer" index.html
          git config user.name "ModProd Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(v1): restore full index.html from commit 483e7e6"
          git push origin HEAD:main
