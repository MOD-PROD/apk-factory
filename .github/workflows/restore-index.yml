name: Restore index.html
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore full index.html
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main
          git checkout 483e7e6bcec1578d7a0934084ea7651779ca6638 -- index.html
          echo "Restored size: $(wc -c < index.html)"
          test $(wc -c < index.html) -gt 100000
          grep -q "Fabriquer" index.html
          git config user.name "ModProd Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index already good"
            exit 0
          fi
          git commit -m "fix(v1): restore full index.html from commit 483e7e6"
          git push origin HEAD:main
