name: Restore index.html
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add webTheme form selector
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("index.html")
          t = p.read_text()
          if 'name="webTheme"' in t:
              print("webTheme already present")
              raise SystemExit(0)
          old_ui = """      <div class="field"><span>Orientation</span>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="orientation" value="portrait" checked><span>Portrait</span></label>
          <label><input type="radio" name="orientation" value="auto"><span>Suit la rotation</span></label>
        </div></div>

      <label class="check"><input type="checkbox" name="fullscreen" value="true"><span>Plein écran (masque la barre d'état)</span></label>"""
          new_ui = """      <div class="field"><span>Orientation</span>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="orientation" value="portrait" checked><span>Portrait</span></label>
          <label><input type="radio" name="orientation" value="auto"><span>Suit la rotation</span></label>
        </div></div>

      <div class="field"><span>Thème des sites web</span>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="webTheme" value="auto" checked><span>Auto</span></label>
          <label><input type="radio" name="webTheme" value="native"><span>Sombre natif</span></label>
          <label><input type="radio" name="webTheme" value="css"><span>CSS</span></label>
          <label><input type="radio" name="webTheme" value="invert"><span>Inversion</span></label>
        </div>
        <small class="hint">Auto respecte le site. Natif utilise le dark mode Android. CSS et inversion injectent des styles (expérimental, selon le site).</small></div>

      <label class="check"><input type="checkbox" name="fullscreen" value="true"><span>Plein écran (masque la barre d'état)</span></label>"""
          old_fd = """  fd.append("orientation", f.orientation.value);
  ["fullscreen", "keepScreenOn", "zoom", "camera", "microphone", "location", "blockScreenshots"]
    .forEach(k => fd.append(k, f.elements[k].checked ? "true" : "false"));"""
          new_fd = """  fd.append("orientation", f.orientation.value);
  fd.append("webTheme", (f.webTheme && f.webTheme.value) || "auto");
  ["fullscreen", "keepScreenOn", "zoom", "camera", "microphone", "location", "blockScreenshots"]
    .forEach(k => fd.append(k, f.elements[k].checked ? "true" : "false"));"""
          if old_ui not in t:
              raise SystemExit("orientation block not found")
          if old_fd not in t:
              raise SystemExit("formData block not found")
          t = t.replace(old_ui, new_ui, 1).replace(old_fd, new_fd, 1)
          p.write_text(t)
          print("patched", len(t), "webTheme", t.count("webTheme"))
          PY
          git config user.name "ModProd Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "feat(v1): add webTheme selector to web/html form"
          git pull --rebase origin main
          git push origin HEAD:main
