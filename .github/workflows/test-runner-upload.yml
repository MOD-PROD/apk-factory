name: Test runner callbacks

on:
  push:
    paths:
      - 'functions/api/runner/upload.js'
      - 'functions/api/runner/cleanup.js'
      - 'tests/r2-cleanup.test.mjs'
      - 'functions/api/runner/selftest.js'
      - 'functions/api/build.js'
      - 'functions/api/session.js'
      - 'functions/_middleware.js'
      - 'tests/access-middleware.test.mjs'
      - 'tests/session.test.mjs'
      - 'index.html'
      - 'drive-backup.js'
      - 'history-sync.js'
      - 'tests/history-sync.test.mjs'
      - 'functions/api/drive/config.js'
      - 'tests/drive-backup.test.mjs'
      - 'tests/drive-config.test.mjs'
      - 'tests/frontend-integration.test.mjs'
      - 'functions/api/runner/file.js'
      - 'tests/build-flow.test.mjs'
      - 'functions/api/runner/dl.js'
      - 'tests/r2-roundtrip.test.mjs'
      - 'functions/_shared.js'
      - 'functions/api/status.js'
      - '.github/scripts/build_app.py'
      - 'tests/test_html_archive.py'
      - 'tests/status.test.mjs'
      - 'tests/status-rate-limit.test.mjs'
      - 'tests/status-capability.test.mjs'
      - 'tests/runner-upload.test.mjs'
      - '.github/workflows/test-runner-upload.yml'
  pull_request:
    paths:
      - 'functions/api/runner/upload.js'
      - 'functions/api/runner/cleanup.js'
      - 'tests/r2-cleanup.test.mjs'
      - 'functions/api/runner/selftest.js'
      - 'functions/api/build.js'
      - 'functions/api/session.js'
      - 'functions/_middleware.js'
      - 'tests/access-middleware.test.mjs'
      - 'tests/session.test.mjs'
      - 'index.html'
      - 'drive-backup.js'
      - 'history-sync.js'
      - 'tests/history-sync.test.mjs'
      - 'functions/api/drive/config.js'
      - 'tests/drive-backup.test.mjs'
      - 'tests/drive-config.test.mjs'
      - 'tests/frontend-integration.test.mjs'
      - 'functions/api/runner/file.js'
      - 'tests/build-flow.test.mjs'
      - 'functions/api/runner/dl.js'
      - 'tests/r2-roundtrip.test.mjs'
      - 'functions/_shared.js'
      - 'functions/api/status.js'
      - '.github/scripts/build_app.py'
      - 'tests/test_html_archive.py'
      - 'tests/status.test.mjs'
      - 'tests/status-rate-limit.test.mjs'
      - 'tests/status-capability.test.mjs'
      - 'tests/runner-upload.test.mjs'
      - '.github/workflows/test-runner-upload.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Python archive extraction
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Regression tests for APK callbacks
        run: node --experimental-default-type=module --test tests/*.test.mjs
